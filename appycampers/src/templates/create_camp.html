{% extends "base.html" %}
{% block title %} Camp Details {% endblock %}
{% block content %}
<section class="page-banner">
  <div class="l-box">
    <h1>Create a Campout</h1>
    <p>Plan the details, decide the essentials, and start gathering campers</p>
  </div>
</section>
<div class="pure-g">
  <div class="pure-u-2-3">
    <form class="pure-form pure-form-stacked">
      <fieldset>
        <legend><b>1 Camp Details</b> -> 2 Gear Requirements -> 3 Invite Others</legend>
        <div class="pure-g">
          <div class="pure-u-1 pure-u-md-1-1">
            <label for="camp-name">Campout Name</label>
            <input id="camp-name" class="pure-u-23-24" type="text" />
          </div>
          <div class="pure-u-1 pure-u-md-1-2">
            <label for="multi-city">City</label>
            <input id="multi-city" class="pure-u-23-24" type="text" />
          </div>
          <div class="pure-u-1 pure-u-md-1-2">
            <label for="multi-state">State</label>
            <select id="multi-state" class="pure-input-1-2">
              <option>MN</option>
            </select>
          </div>
          <div class="pure-u-1 pure-u-md-1-1">
            <label for="location">City</label>
            <input id="location" class="pure-u-23-24" type="text" />
          </div>
        </div>
        <button type="submit" class="pure-button pure-button-primary">Next</button>
      </fieldset>
    </form>
  </div>
</div>
</div>

{% endblock %}
