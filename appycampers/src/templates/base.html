<!DOCTYPE html>
<html lang="en">

<head>
    {% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/pure-min.css"
        integrity="sha384-kj0X2NG2KHBie8Tq8fH1kxnyWM9XsXQpq7XdwbKmFKjwwaXGKBlB2Klu3VOltSFx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/grids-responsive-min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="{{ url_for('static', filename='js/navigation.js') }}" defer></script>
    {% endblock %}
</head>

<body>
    <div class="page">

        <header class="site-header">
            <div class="custom-wrapper pure-g" id="menu">
                <div class="pure-u-1 pure-u-lg-1-4">
                    <div class="pure-menu">
                        <a href="{{ url_for('home') }}" class="pure-menu-heading">Appy Campers</a>
                        <button type="button" class="custom-toggle" id="toggle">
                            <span class="bar"></span><span class="bar"></span>Menu
                        </button>
                    </div>
                </div>
                <div class="pure-u-1 pure-u-lg-3-4" id="menu-links">
                    <nav class="pure-menu pure-menu-horizontal custom-menu-3 custom-can-transform">
                        {% include "navigation.html" %}
                    </nav>
                </div>
            </div>
        </header>

        <main id="page-content">
            {% block content %}
            {% endblock %}
        </main>

        <footer id="site-footer" class="site-footer">
            {% block footer %}
            <span>Appy Campers</span>
            {% endblock %}
        </footer>
    </div>
</body>

</html>
